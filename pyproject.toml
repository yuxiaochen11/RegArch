[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regarch"
version = "0.1.0"
description = "Dynamic gene regulatory network inference using lineage tracing and multi-omics data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Xiaochen Yu" }]
keywords = [
  "gene-regulatory-network",
  "lineage-tracing",
  "single-cell",
  "transcriptomics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython",
  "colorlog",
  "ete3",
  "matplotlib",
  "networkx",
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "seaborn",
  "tqdm",
]

[project.optional-dependencies]
demo = ["jupyter>=1.0", "nbconvert>=7.16,<8"]
docs = ["sphinx>=7.2,<9", "myst-parser>=4,<5", "furo"]
test = ["pytest"]
benchmark = ["arboreto"]

[project.urls]
Documentation = "https://regarch.readthedocs.io"
Repository = "https://github.com/yuxiaochen11/RegArch"

[tool.setuptools.packages.find]
include = ["regarch*"]
namespaces = false

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
