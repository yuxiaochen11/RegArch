name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[demo,test,docs]"
      - run: python -m pytest -q
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Execute demo notebooks
        run: |
          for notebook in examples/demos/*.ipynb; do
            jupyter nbconvert --to notebook --execute "$notebook" \
              --output-dir /tmp/regarch-notebooks \
              --ExecutePreprocessor.timeout=900
          done
